[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soota"
version = "0.1.0"
description = "Collect source text, download media and subtitles, and create traceable context bundles."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*"]
requires-python = ">=3.12"
authors = [{ name = "Soota" }]
keywords = ["transcript", "youtube", "bilibili", "tikhub", "markdown"]
dependencies = [
    "tikhub==2.1.2",
    "typer>=0.12",
    "pydantic>=2.6",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "jsonschema>=4.23,<5",
    "webvtt-py>=0.5.1,<0.6",
]

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-jsonschema>=4.26.0.20260518",
]

[project.scripts]
soota = "soota.cli:app"

[project.urls]
Documentation = "https://docs.tikhub.io"

[tool.hatch.build]
exclude = ["/PLAN.md", "/PLAN.zh-CN.md", "/docs/private/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/soota"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["soota"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tikhub", "tikhub.*", "faster_whisper", "webvtt", "webvtt.*"]
ignore_missing_imports = true
